<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>TESTE DE BUSCA - API MERCADO LIVRE</title>
    <style>
        body { background: #050505; color: white; font-family: sans-serif; padding: 20px; }
        .box { background: #111; border: 1px solid #f1c40f; padding: 20px; border-radius: 10px; max-width: 800px; margin: auto; }
        input { width: 70%; padding: 10px; background: #000; border: 1px solid #333; color: #fff; }
        button { padding: 10px 20px; background: #f1c40f; border: none; cursor: pointer; font-weight: bold; }
        #resultados { 
            display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); 
            gap: 10px; margin-top: 20px; 
        }
        .card { background: #1a1a1a; padding: 10px; border-radius: 5px; text-align: center; cursor: pointer; border: 1px solid #222; }
        .card:hover { border-color: #f1c40f; }
        .card img { width: 100%; height: 100px; object-fit: contain; }
        .card p { font-size: 12px; margin: 10px 0; height: 30px; overflow: hidden; }
        #detalhes { margin-top: 30px; padding: 20px; border-top: 2px solid #333; display: none; }
        pre { background: #000; padding: 10px; font-size: 11px; color: #00ff88; overflow-x: auto; white-space: pre-wrap; }
    </style>
</head>
<body>

<div class="box">
    <h2 style="color: #f1c40f;">Laboratório de Busca (API ML)</h2>
    <p style="font-size: 13px; color: #888;">Digite um produto para testar se a API responde ao seu domínio do GitHub.</p>
    
    <input type="text" id="query" placeholder="Ex: Perfume Kaiak">
    <button onclick="testarBusca()">BUSCAR</button>

    <div id="resultados"></div>

    <div id="detalhes">
        <h3 style="color: #f1c40f;">Dados Capturados para o seu Sistema:</h3>
        <p id="info-status" style="color: #00ff88;"></p>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
            <div>
                <label>Título:</label><br>
                <input type="text" id="res-titulo" style="width: 100%; margin-bottom: 10px;">
                <label>Preço:</label><br>
                <input type="text" id="res-preco" style="width: 100%; margin-bottom: 10px;">
                <label>Descrição (Capturada via API):</label><br>
                <textarea id="res-desc" style="width: 100%; height: 100px; background: #000; color: #fff;"></textarea>
            </div>
            <div>
                <label>Fotos em HD (Links extraídos):</label>
                <pre id="res-fotos"></pre>
            </div>
        </div>
    </div>
</div>

<script>
    async function testarBusca() {
        const q = document.getElementById('query').value;
        const resDiv = document.getElementById('resultados');
        if(!q) return;

        resDiv.innerHTML = "Buscando...";
        
        try {
            // Chamada à API Pública de Busca
            const response = await fetch(`https://api.mercadolibre.com/sites/MLB/search?q=${encodeURIComponent(q)}&limit=4`);
            const data = await response.json();

            resDiv.innerHTML = "";
            data.results.forEach(item => {
                const div = document.createElement('div');
                div.className = 'card';
                div.innerHTML = `
                    <img src="${item.thumbnail}">
                    <p>${item.title}</p>
                    <button style="font-size:10px; padding:5px;">TESTAR CAPTURA</button>
                `;
                div.onclick = () => capturarDadosCompletos(item.id);
                resDiv.appendChild(div);
            });
        } catch (e) {
            resDiv.innerHTML = "Erro na API: " + e;
        }
    }

    async function capturarDadosCompletos(id) {
        document.getElementById('detalhes').style.display = "block";
        document.getElementById('info-status').innerText = "Capturando detalhes de " + id + "...";

        try {
            // Chamada para pegar detalhes e descrição separadamente
            const [respItem, respDesc] = await Promise.all([
                fetch(`https://api.mercadolibre.com/items/${id}`),
                fetch(`https://api.mercadolibre.com/items/${id}/description`)
            ]);

            const item = await respItem.json();
            const desc = await respDesc.json();

            // Preenchendo os campos de teste
            document.getElementById('res-titulo').value = item.title;
            document.getElementById('res-preco').value = item.price.toLocaleString('pt-BR', {minimumFractionDigits: 2});
            document.getElementById('res-desc').value = desc.plain_text || "Sem descrição";
            
            // Lógica de Mestre para Fotos HD (Convertendo thumbnail para foto grande)
            const linksHD = item.pictures.slice(0, 4).map(pic => pic.url.replace('-I.jpg', '-O.jpg'));
            document.getElementById('res-fotos').innerText = linksHD.join('\n');
            
            document.getElementById('info-status').innerText = "✅ SUCESSO! Dados recebidos com sucesso.";
            
        } catch (e) {
            document.getElementById('info-status').innerText = "Erro ao capturar detalhes: " + e;
        }
    }
</script>

</body>
</html>
