<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>MASTER ADMIN | DIRECT SHOP</title>
  <style>
    :root { --gold: #f1c40f; --bg: #050505; --card: #0d0d0d; --border: #333; }
    body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: #fff; display: flex; justify-content: center; min-height: 100vh; }
    #login-screen { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; width: 100%; }
    .login-box { background: var(--card); padding: 30px; border: 1px solid var(--gold); border-radius: 15px; width: 350px; }
    .dashboard { display: none; width: 98%; max-width: 1800px; background: var(--card); margin: 20px; padding: 40px; border-radius: 15px; border: 1px solid var(--border); }
    .header-dash { display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--gold); padding-bottom: 20px; margin-bottom: 40px; }
    .header-dash h2 { margin: 0; font-size: 30px; letter-spacing: 5px; color: var(--gold); text-transform: uppercase; }
    input, select, textarea { width: 100%; padding: 18px; background: #000; border: 1px solid #333; color: #fff; border-radius: 8px; font-size: 15px; box-sizing: border-box; margin-bottom: 15px; }
    .btn-pub { width: 100%; padding: 25px; background: var(--gold); color: #000; border: none; border-radius: 12px; font-size: 20px; font-weight: 900; cursor: pointer; text-transform: uppercase; }
    #status { position: fixed; top: 40px; left: 50%; transform: translateX(-50%); z-index: 9999; padding: 25px 60px; border-radius: 15px; background: #000; border: 2px solid var(--gold); color: var(--gold); font-size: 20px; font-weight: 900; display: none; }
    .item-busca { padding: 15px; border-bottom: 1px solid #222; cursor: pointer; color: var(--gold); font-weight: bold; }
  </style>
</head>
<body>

  <div id="login-screen">
    <div class="login-box">
      <h2 style="text-align:center; color:var(--gold);">LOGIN MASTER</h2>
      <label>Usuário GitHub:</label>
      <input type="text" id="login-user" placeholder="Seu usuário">
      <label>Repositório:</label>
      <input type="text" id="login-repo" placeholder="nome-do-repo">
      <label>Token (ghp_...):</label>
      <input type="password" id="login-token" placeholder="Cole seu Token aqui">
      <button class="btn-pub" onclick="login()">CONECTAR GITHUB</button>
    </div>
  </div>

  <div class="dashboard" id="admin-panel">
    <div class="header-dash">
      <h2>DIRECT SHOP MASTER ADMIN</h2>
      <button onclick="logout()" style="background:none; border:1px solid #333; color:#444; padding:10px; cursor:pointer;">SAIR / DESLOGAR</button>
    </div>
    
    <div style="position:relative; margin-bottom:40px;">
      <input type="text" id="busca-editar" placeholder="🔍 BUSCAR PRODUTO EXISTENTE..." oninput="buscarParaEditar()" style="border:2px solid var(--gold);">
      <div id="lista-busca" style="position:absolute; width:100%; background:#000; z-index:100;"></div>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 40px;">
      <div class="col">
        <label>Título</label><input type="text" id="p-titulo">
        <label>Subtítulo</label><input type="text" id="p-subtitulo">
        <label>Preço</label><input type="text" id="p-preco">
        <label>Categoria</label><select id="p-categoria"><option value="perfumes">Perfumes</option><option value="tecnologia">Tecnologia</option></select>
        <label>Descrição</label><textarea id="p-descricao" rows="4"></textarea>
      </div>
      <div class="col">
        <label>Link Afiliado</label><input type="text" id="p-link">
        <label>ID Loja</label><input type="text" id="p-loja" value="ml">
        <label>Nota</label><input type="text" id="p-nota" value="4.8">
        <label>Estoque</label><input type="number" id="p-estoque">
        <label>Imagens (URLs)</label>
        <input type="text" id="img1" placeholder="URL Foto 1">
        <input type="text" id="img2" placeholder="URL Foto 2">
        <button class="btn-pub" id="btn-save" onclick="salvarProduto()">PUBLICAR NO SITE</button>
        <div id="status"></div>
      </div>
    </div>
  </div>

  <script>
    let produtosCarregados = [];
    let editandoIndex = null;

    window.onload = () => { if(localStorage.getItem('gh_token')) mostrarPainel(); };

    function login() {
      const u = document.getElementById('login-user').value;
      const r = document.getElementById('login-repo').value;
      const t = document.getElementById('login-token').value;
      if(u && r && t) {
        localStorage.setItem('gh_user', u);
        localStorage.setItem('gh_repo', r);
        localStorage.setItem('gh_token', t);
        location.reload();
      } else { alert("Preencha tudo!"); }
    }

    function logout() { localStorage.clear(); location.reload(); }
    function mostrarPainel() { document.getElementById('login-screen').style.display='none'; document.getElementById('admin-panel').style.display='block'; carregarListaEdicao(); }

    async function carregarListaEdicao() {
      const u = localStorage.getItem('gh_user'), r = localStorage.getItem('gh_repo'), t = localStorage.getItem('gh_token');
      try {
        const res = await fetch(`https://api.github.com/repos/${u}/${r}/contents/produtos.json`, { 
          headers: { 'Authorization': `Bearer ${t}`, 'Cache-Control': 'no-cache' } 
        });
        const file = await res.json();
        produtosCarregados = JSON.parse(decodeURIComponent(escape(atob(file.content))));
      } catch (e) { console.log("Erro ao carregar"); }
    }

    async function salvarProduto() {
      const btn = document.getElementById('btn-save'), st = document.getElementById('status');
      const u = localStorage.getItem('gh_user'), r = localStorage.getItem('gh_repo'), t = localStorage.getItem('gh_token');
      const url = `https://api.github.com/repos/${u}/${r}/contents/produtos.json`;
      
      btn.disabled = true; btn.innerText = "CONECTANDO AO GITHUB...";

      try {
        // BUSCA O ARQUIVO E O SHA MAIS RECENTE
        const res = await fetch(url, { headers: { 'Authorization': `Bearer ${t}`, 'Cache-Control': 'no-cache' } });
        if(!res.ok) throw new Error("Falha no Token ou Repositório");
        
        const file = await res.json();
        let content = JSON.parse(decodeURIComponent(escape(atob(file.content))));

        const novo = {
          titulo: document.getElementById('p-titulo').value,
          subtitulo: document.getElementById('p-subtitulo').value,
          preco: document.getElementById('p-preco').value,
          nota: document.getElementById('p-nota').value,
          loja: document.getElementById('p-loja').value,
          categoria: document.getElementById('p-categoria').value,
          descricao: document.getElementById('p-descricao').value,
          link: document.getElementById('p-link').value,
          estoque: document.getElementById('p-estoque').value,
          imagens: [document.getElementById('img1').value, document.getElementById('img2').value].filter(i => i !== ""),
          data: editandoIndex !== null ? content[editandoIndex].data : new Date().toLocaleDateString('pt-BR')
        };

        if (editandoIndex !== null) content[editandoIndex] = novo; else content.unshift(novo);

        // ENVIA USANDO O TOKEN NO HEADER "BEARER" (PADRÃO ATUAL DO GITHUB)
        const save = await fetch(url, {
          method: 'PUT',
          headers: { 'Authorization': `Bearer ${t}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            message: "Update via Master Admin", 
            content: btoa(unescape(encodeURIComponent(JSON.stringify(content, null, 2)))), 
            sha: file.sha 
          })
        });

        if(save.ok) {
          st.innerText = "🚀 SITE ATUALIZADO!"; st.style.display = "block";
          setTimeout(() => location.reload(), 2000);
        } else { alert("Erro ao salvar! Verifique as permissões do seu Token."); }
      } catch (e) { alert("ERRO DE TOKEN: " + e.message); }
      btn.disabled = false; btn.innerText = "PUBLICAR NO SITE";
    }

    function buscarParaEditar() {
      const termo = document.getElementById('busca-editar').value.toLowerCase();
      const lista = document.getElementById('lista-busca');
      lista.innerHTML = ""; if (termo.length < 2) return;
      produtosCarregados.forEach((p, index) => {
        if (p.titulo.toLowerCase().includes(termo)) {
          const item = document.createElement('div'); item.className = "item-busca"; item.innerText = "✏️ " + p.titulo;
          item.onclick = () => {
            editandoIndex = index;
            document.getElementById('p-titulo').value = p.titulo;
            document.getElementById('p-preco').value = p.preco;
            document.getElementById('p-link').value = p.link;
            document.getElementById('btn-save').innerText = "ATUALIZAR";
            lista.innerHTML = "";
          };
          lista.appendChild(item);
        }
      });
    }
  </script>
</body>
</html>
