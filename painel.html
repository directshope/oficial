<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>MASTER ADMIN | DIRECT SHOP</title>
  <style>
    :root { --gold: #f1c40f; --bg: #050505; --card: #0d0d0d; --border: #333; }
    body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: #fff; display: flex; justify-content: center; min-height: 100vh; }
    .dashboard { width: 98%; max-width: 1800px; background: var(--card); margin: 20px; padding: 40px; border-radius: 15px; border: 1px solid var(--border); }
    .header-dash { display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--gold); padding-bottom: 20px; margin-bottom: 40px; }
    .header-dash h2 { margin: 0; font-size: 30px; letter-spacing: 5px; color: var(--gold); text-transform: uppercase; }
    .search-box { position: relative; margin-bottom: 40px; }
    #busca-editar { width: 100%; padding: 20px; background: #000; border: 2px solid var(--gold); color: #fff; border-radius: 10px; font-size: 18px; }
    .main-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 60px; align-items: start; }
    .column-title { font-size: 13px; color: var(--gold); text-transform: uppercase; margin-bottom: 30px; letter-spacing: 2px; font-weight: 800; display: flex; align-items: center; gap: 15px; }
    .column-title::after { content: ""; flex: 1; height: 1px; background: #333; }
    .input-group { margin-bottom: 25px; }
    .input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    label { display: block; margin-bottom: 10px; color: #888; font-size: 11px; font-weight: bold; text-transform: uppercase; }
    input, select { width: 100%; padding: 18px; background: #000; border: 1px solid #333; color: #fff; border-radius: 8px; font-size: 15px; box-sizing: border-box; }
    input:focus { border-color: var(--gold); outline: none; }
    .photos-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-bottom: 20px; }
    .actions { display: flex; gap: 20px; margin-top: 40px; }
    .btn-pub { flex: 3; padding: 25px; background: var(--gold); color: #000; border: none; border-radius: 12px; font-size: 20px; font-weight: 900; cursor: pointer; text-transform: uppercase; }
    .btn-new { flex: 1; padding: 25px; background: #222; color: #fff; border: 1px solid #333; border-radius: 12px; font-weight: bold; cursor: pointer; }
    #lista-busca { position: absolute; width: 100%; z-index: 100; background: #000; border: 1px solid var(--gold); max-height: 300px; overflow-y: auto; }
    .item-busca { padding: 15px; border-bottom: 1px solid #222; cursor: pointer; color: var(--gold); font-weight: bold; }
    .logout-btn { background: none; color: #444; border: 1px solid #333; padding: 10px 20px; border-radius: 8px; cursor: pointer; }
    #status { position: fixed; top: 40px; left: 50%; transform: translateX(-50%); z-index: 9999; padding: 25px 60px; border-radius: 15px; background: #000; border: 2px solid var(--gold); color: var(--gold); font-size: 20px; font-weight: 900; text-transform: uppercase; box-shadow: 0 0 50px rgba(241, 196, 15, 0.4); display: none; letter-spacing: 2px; animation: surge 0.5s ease-out; }
    @keyframes surge { from { top: -100px; opacity: 0; } to { top: 40px; opacity: 1; } }
  </style>
</head>
<body>
  <div class="dashboard" id="admin-panel">
    <div class="header-dash">
      <h2>DIRECT SHOP MASTER ADMIN</h2>
      <button class="logout-btn" onclick="logout()">SAIR</button>
    </div>
    <div class="search-box">
      <input type="text" id="busca-editar" placeholder="🔍 PESQUISAR PRODUTO PARA EDITAR..." oninput="buscarParaEditar()">
      <div id="lista-busca"></div>
    </div>
    <div class="main-grid">
      <div class="col">
        <div class="column-title">Vendas & Categorização</div>
        <div class="input-group"><label>Nome do Produto:</label><input type="text" id="p-titulo"></div>
        <div class="input-row">
          <div class="input-group"><label>Subtítulo:</label><input type="text" id="p-subtitulo"></div>
          <div class="input-group"><label>Preço Final (R$):</label><input type="text" id="p-preco"></div>
        </div>
        <div class="input-row">
          <div class="input-group">
            <label>Categoria:</label>
            <select id="p-categoria">
              <option value="perfumes">Perfumes</option>
              <option value="tecnologia">Tecnologia</option>
              <option value="beleza">Beleza e Cuidados Pessoais</option>
              <option value="ferramentas">Ferramentas</option>
              <option value="casa">Casa e Móveis</option>
              <option value="esportes">Esportes e Fitness</option>
              <option value="saude">Saúde</option>
              <option value="veiculos">Acessórios para Veículos</option>
              <option value="moda">Moda</option>
            </select>
          </div>
          <div class="input-group">
            <label>Selo:</label>
            <select id="p-tag">
              <option value="">Sem Selo</option>
              <option value="Mais Vendido">🔥 Mais Vendido</option>
              <option value="Oferta do Dia">⚡ Oferta do Dia</option>
              <option value="Promoção">💎 Promoção</option>
            </select>
          </div>
        </div>
        <div class="column-title">Logística & Links</div>
        <div class="input-row">
          <div class="input-group"><label>ID Loja:</label><input type="text" id="p-loja" value="ml"></div>
          <div class="input-group"><label>Estoque Atual:</label><input type="number" id="p-estoque"></div>
        </div>
        <div class="input-group"><label>URL de Destino (Link Afiliado):</label><input type="text" id="p-link"></div>
        <div class="input-group">
  <label>Descrição do Produto:</label>
  <textarea id="p-descricao" rows="4" style="width: 100%; background: #000; border: 1px solid #333; color: #fff; border-radius: 8px; padding: 15px; font-family: sans-serif;"></textarea>
</div>
      </div>
      <div class="col">
        <div class="column-title">Galeria de Imagens (HD)</div>
        <div class="photos-grid">
          <div class="input-group"><label>Foto 1:</label><input type="text" id="img1"></div>
          <div class="input-group"><label>Foto 2:</label><input type="text" id="img2"></div>
          <div class="input-group"><label>Foto 3:</label><input type="text" id="img3"></div>
          <div class="input-group"><label>Foto 4:</label><input type="text" id="img4"></div>
        </div>
        <div class="column-title">Métricas de Avaliação</div>
        <div class="input-row">
          <div class="input-group"><label>Nota (0-5):</label><input type="number" id="p-nota" step="0.1" value="4.8"></div>
          <div class="input-group"><label>Avaliações Totais:</label><input type="number" id="p-avaliacoes"></div>
        </div>
        <div class="actions">
          <button class="btn-new" onclick="limparFormulario()">LIMPAR / NOVO</button>
          <button class="btn-pub" id="btn-save" onclick="salvarProduto()">PUBLICAR NO SITE</button>
        </div>
        <div id="status"></div>
      </div>
    </div>
  </div>

  <script>
    let produtosCarregados = [];
    let editandoIndex = null;

    window.onload = () => { if(localStorage.getItem('gh_token')) mostrarPainel(); };
    function mostrarPainel() { document.getElementById('admin-panel').style.display='block'; carregarListaEdicao(); }
    function logout() { localStorage.clear(); location.reload(); }

    async function carregarListaEdicao() {
      const u = localStorage.getItem('gh_user'), r = localStorage.getItem('gh_repo'), t = localStorage.getItem('gh_token');
      try {
        const res = await fetch(`https://api.github.com/repos/${u}/${r}/contents/produtos.json`, { headers: { 'Authorization': `token ${t}` } });
        const file = await res.json();
        produtosCarregados = JSON.parse(decodeURIComponent(escape(atob(file.content))));
      } catch (e) { console.log("Erro ao carregar lista"); }
    }

    function limparFormulario() {
      editandoIndex = null;
      ['p-titulo', 'p-subtitulo', 'p-preco', 'p-link', 'p-avaliacoes', 'p-estoque', 'img1', 'img2', 'img3', 'img4'].forEach(id => { document.getElementById(id).value = ""; });
      document.getElementById('p-nota').value = "4.8";
      document.getElementById('p-loja').value = "ml";
      document.getElementById('p-tag').value = "";
      document.getElementById('p-categoria').value = "perfumes";
      document.getElementById('btn-save').innerText = "PUBLICAR NO SITE";
      document.getElementById('status').style.display = "none";
    }

    function buscarParaEditar() {
      const termo = document.getElementById('busca-editar').value.toLowerCase();
      const lista = document.getElementById('lista-busca');
      lista.innerHTML = ""; if (termo.length < 2) return;
      produtosCarregados.forEach((p, index) => {
        if (p.titulo.toLowerCase().includes(termo)) {
          const item = document.createElement('div');
          item.className = "item-busca";
          item.innerText = "✏️ " + p.titulo;
          item.onclick = () => {
            editandoIndex = index;
            document.getElementById('p-titulo').value = p.titulo;
            document.getElementById('p-subtitulo').value = p.subtitulo || "";
            document.getElementById('p-preco').value = p.preco;
            document.getElementById('p-tag').value = p.tag || "";
            document.getElementById('p-nota').value = p.nota;
            document.getElementById('p-avaliacoes').value = p.avaliacoes;
            document.getElementById('p-estoque').value = p.estoque;
            document.getElementById('p-link').value = p.link;
            document.getElementById('p-loja').value = p.loja;
            document.getElementById('p-categoria').value = p.categoria || "perfumes";
            for(let i=1; i<=4; i++) { document.getElementById(`img${i}`).value = (p.imagens && p.imagens[i-1]) ? p.imagens[i-1] : ""; }
            document.getElementById('btn-save').innerText = "ATUALIZAR DADOS";
            document.getElementById('busca-editar').value = "";
            lista.innerHTML = "";
          };
          lista.appendChild(item);
        }
      });
    }

    async function salvarProduto() {
      const btn = document.getElementById('btn-save'), st = document.getElementById('status');
      const imgs = [1,2,3,4].map(i => document.getElementById(`img${i}`).value).filter(i => i !== "");
      const user = localStorage.getItem('gh_user'), repo = localStorage.getItem('gh_repo'), token = localStorage.getItem('gh_token');
      const url = `https://api.github.com/repos/${user}/${repo}/contents/produtos.json`;
      
      btn.disabled = true; btn.innerText = "SALVANDO...";

      try {
        // CORREÇÃO: Pega o arquivo atualizado para ter o SHA correto
        const res = await fetch(url, { headers: { 'Authorization': `token ${token}` } });
        const file = await res.json();
        let content = JSON.parse(decodeURIComponent(escape(atob(file.content))));

        const novoProduto = {
          titulo: document.getElementById('p-titulo').value,
          subtitulo: document.getElementById('p-subtitulo').value,
          preco: document.getElementById('p-preco').value,
          tag: document.getElementById('p-tag').value,
          nota: document.getElementById('p-nota').value,
          avaliacoes: document.getElementById('p-avaliacoes').value,
          estoque: document.getElementById('p-estoque').value,
          link: document.getElementById('p-link').value,
          loja: document.getElementById('p-loja').value,
          categoria: document.getElementById('p-categoria').value,
          descricao: document.getElementById('p-descricao').value,
          imagens: imgs,
          data: editandoIndex !== null ? content[editandoIndex].data : new Date().toLocaleDateString('pt-BR')
        };

        if (editandoIndex !== null) content[editandoIndex] = novoProduto; 
        else content.unshift(novoProduto);

        const save = await fetch(url, {
          method: 'PUT',
          headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            message: "Update via Master Admin", 
            content: btoa(unescape(encodeURIComponent(JSON.stringify(content, null, 2)))), 
            sha: file.sha 
          })
        });

        if(save.ok) { 
          st.innerText = "🚀 PRODUTO PUBLICADO COM SUCESSO!"; 
          st.style.display = "block"; 
          setTimeout(() => { st.style.display = "none"; limparFormulario(); }, 3000); 
          carregarListaEdicao(); 
        } else {
          alert("Erro ao salvar no GitHub!");
          btn.disabled = false; btn.innerText = "TENTAR NOVAMENTE";
        }
      } catch (e) { 
        console.error(e);
        alert("Erro de conexão!"); 
        btn.disabled = false; btn.innerText = "TENTAR NOVAMENTE"; 
      }
    }
  </script>
</body>
</html>
