<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Dashboard Direct Shop</title>
  <style>
    :root { --gold: #f1c40f; --bg: #050505; --card: #111; --border: #222; }
    body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); color: #fff; display: flex; justify-content: center; padding: 10px; }
    
    /* Container mais largo para caber mais colunas */
    .container { background: var(--card); width: 100%; max-width: 950px; padding: 25px; border-radius: 12px; border: 1px solid var(--border); box-shadow: 0 10px 50px #000; }
    
    h2 { color: var(--gold); text-align: center; margin: 0 0 20px; font-size: 18px; text-transform: uppercase; letter-spacing: 2px; }
    
    .section-title { font-size: 10px; color: var(--gold); border-bottom: 1px solid var(--border); margin: 15px 0 10px; text-transform: uppercase; font-weight: bold; }
    
    /* Layout em Grade (Grid) para economizar espaço vertical */
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    
    .input-group { margin-bottom: 10px; }
    label { display: block; margin-bottom: 4px; color: #666; font-size: 10px; text-transform: uppercase; font-weight: bold; }
    
    input, select { width: 100%; padding: 10px; background: #000; border: 1px solid var(--border); color: #fff; border-radius: 6px; box-sizing: border-box; font-size: 13px; }
    input:focus { border-color: var(--gold); outline: none; }

    /* Busca compacta */
    #lista-busca { background: #000; position: absolute; width: 100%; max-width: 900px; z-index: 100; border: 1px solid var(--gold); border-top: none; max-height: 200px; overflow-y: auto; }
    .item-busca { padding: 10px; border-bottom: 1px solid #111; cursor: pointer; font-size: 12px; color: var(--gold); }
    .item-busca:hover { background: #1a1a1a; }

    .btn-main { width: 100%; padding: 15px; background: var(--gold); color: #000; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; text-transform: uppercase; margin-top: 20px; }
    .logout-btn { background: none; color: #444; border: none; font-size: 10px; cursor: pointer; text-decoration: underline; margin-top: 20px; }
    
    #admin-panel { display: none; position: relative; }
    #status { text-align: center; margin-top: 10px; font-weight: bold; font-size: 12px; }
  </style>
</head>
<body>

  <div class="container" id="login-screen">
    <h2>Acesso Admin</h2>
    <div class="grid-3">
      <div class="input-group"><label>Usuário:</label><input type="text" id="gh-user"></div>
      <div class="input-group"><label>Repositório:</label><input type="text" id="gh-repo"></div>
      <div class="input-group"><label>GitHub Key:</label><input type="password" id="gh-token"></div>
    </div>
    <button class="btn-main" onclick="fazerLogin()">Entrar</button>
  </div>

  <div class="container" id="admin-panel">
    <h2>Direct Shop Dashboard</h2>

    <div class="input-group">
      <input type="text" id="busca-editar" placeholder="🔍 Buscar produto para editar..." oninput="buscarParaEditar()">
      <div id="lista-busca"></div>
    </div>

    <div class="section-title">Dados Básicos</div>
    <div class="grid-2">
      <div class="input-group"><label>Título:</label><input type="text" id="p-titulo"></div>
      <div class="input-group"><label>Subtítulo:</label><input type="text" id="p-subtitulo"></div>
    </div>

    <div class="grid-3">
      <div class="input-group"><label>Preço (R$):</label><input type="text" id="p-preco"></div>
      <div class="input-group">
        <label>Categoria:</label>
        <select id="p-categoria">
          <option value="perfumes">Perfumes</option>
          <option value="tecnologia">Tecnologia</option>
          <option value="beleza">Beleza e Cuidados</option>
          <option value="ferramentas">Ferramentas</option>
          <option value="casa">Casa e Móveis</option>
          <option value="esportes">Esportes e Fitness</option>
          <option value="saude">Saúde</option>
          <option value="veiculos">Veículos</option>
          <option value="moda">Moda</option>
        </select>
      </div>
      <div class="input-group">
        <label>Selo:</label>
        <select id="p-tag">
          <option value="">Nenhum</option>
          <option value="Mais Vendido">🔥 Mais Vendido</option>
          <option value="Oferta do Dia">⚡ Oferta do Dia</option>
          <option value="Promoção">💎 Promoção</option>
        </select>
      </div>
    </div>

    <div class="section-title">Status & Fotos</div>
    <div class="grid-3">
      <div class="input-group"><label>Nota:</label><input type="number" id="p-nota" step="0.1" value="4.8"></div>
      <div class="input-group"><label>Avaliações:</label><input type="number" id="p-avaliacoes"></div>
      <div class="input-group"><label>Estoque:</label><input type="number" id="p-estoque"></div>
    </div>

    <div class="grid-2">
      <div class="input-group"><label>Fotos (Links):</label>
        <input type="text" id="img1" placeholder="Foto 1 (Capa)" style="margin-bottom:5px">
        <input type="text" id="img2" placeholder="Foto 2">
      </div>
      <div class="input-group"><label>&nbsp;</label>
        <input type="text" id="img3" placeholder="Foto 3" style="margin-bottom:5px">
        <input type="text" id="img4" placeholder="Foto 4">
      </div>
    </div>

    <div class="section-title">Conexão</div>
    <div class="grid-2">
      <div class="input-group"><label>ID Loja (Robô):</label><input type="text" id="p-loja" value="ml"></div>
      <div class="input-group"><label>Link do Produto:</label><input type="text" id="p-link"></div>
    </div>

    <button class="btn-main" id="btn-save" onclick="salvarProduto()">Publicar no Site</button>
    <div id="status"></div>
    <center><button class="logout-btn" onclick="logout()">Sair</button></center>
  </div>

  <script>
    let produtosCarregados = [];
    let editandoIndex = null;
    window.onload = () => { if(localStorage.getItem('gh_token')) mostrarPainel(); };
    function mostrarPainel() { document.getElementById('login-screen').style.display='none'; document.getElementById('admin-panel').style.display='block'; carregarListaEdicao(); }
    function logout() { localStorage.clear(); location.reload(); }
    function fazerLogin() {
      const u = document.getElementById('gh-user').value, r = document.getElementById('gh-repo').value, t = document.getElementById('gh-token').value;
      if(!u || !r || !t) return alert("Preencha tudo!");
      localStorage.setItem('gh_user', u); localStorage.setItem('gh_repo', r); localStorage.setItem('gh_token', t);
      mostrarPainel();
    }
    async function carregarListaEdicao() {
      const u = localStorage.getItem('gh_user'), r = localStorage.getItem('gh_repo'), t = localStorage.getItem('gh_token');
      try {
        const res = await fetch(`https://api.github.com/repos/${u}/${r}/contents/produtos.json`, { headers: { 'Authorization': `token ${t}` } });
        const file = await res.json();
        produtosCarregados = JSON.parse(atob(file.content));
      } catch (e) { console.log("Erro ao carregar lista"); }
    }
    function buscarParaEditar() {
      const termo = document.getElementById('busca-editar').value.toLowerCase();
      const lista = document.getElementById('lista-busca');
      lista.innerHTML = ""; if (termo.length < 2) return;
      produtosCarregados.forEach((p, index) => {
        if (p.titulo.toLowerCase().includes(termo)) {
          const item = document.createElement('div'); item.className = "item-busca"; item.innerText = "✏️ " + p.titulo;
          item.onclick = () => {
            editandoIndex = index;
            document.getElementById('p-titulo').value = p.titulo;
            document.getElementById('p-subtitulo').value = p.subtitulo || "";
            document.getElementById('p-preco').value = p.preco;
            document.getElementById('p-tag').value = p.tag || "";
            document.getElementById('p-nota').value = p.nota;
            document.getElementById('p-avaliacoes').value = p.avaliacoes;
            document.getElementById('p-estoque').value = p.estoque;
            document.getElementById('p-link').value = p.link;
            document.getElementById('p-loja').value = p.loja;
            document.getElementById('p-categoria').value = p.categoria || "perfumes";
            for(let i=1; i<=4; i++) { document.getElementById(`img${i}`).value = (p.imagens && p.imagens[i-1]) ? p.imagens[i-1] : ""; }
            document.getElementById('btn-save').innerText = "ATUALIZAR AGORA";
            lista.innerHTML = "";
          };
          lista.appendChild(item);
        }
      });
    }
    async function salvarProduto() {
      const btn = document.getElementById('btn-save'), st = document.getElementById('status');
      const imgs = [1,2,3,4].map(i => document.getElementById(`img${i}`).value).filter(i => i !== "");
      const user = localStorage.getItem('gh_user'), repo = localStorage.getItem('gh_repo'), token = localStorage.getItem('gh_token');
      const url = `https://api.github.com/repos/${user}/${repo}/contents/produtos.json`;
      btn.disabled = true; btn.innerText = "SALVANDO...";
      try {
        const res = await fetch(url, { headers: { 'Authorization': `token ${token}` } });
        const file = await res.json();
        let content = JSON.parse(atob(file.content));
        const novoProduto = {
          titulo: document.getElementById('p-titulo').value,
          subtitulo: document.getElementById('p-subtitulo').value,
          preco: document.getElementById('p-preco').value,
          tag: document.getElementById('p-tag').value,
          nota: document.getElementById('p-nota').value,
          avaliacoes: document.getElementById('p-avaliacoes').value,
          estoque: document.getElementById('p-estoque').value,
          link: document.getElementById('p-link').value,
          loja: document.getElementById('p-loja').value,
          categoria: document.getElementById('p-categoria').value,
          imagens: imgs,
          data: editandoIndex !== null ? content[editandoIndex].data : new Date().toLocaleDateString('pt-BR')
        };
        if (editandoIndex !== null) content[editandoIndex] = novoProduto; else content.unshift(novoProduto);
        const save = await fetch(url, {
          method: 'PUT', headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: "Update", content: btoa(unescape(encodeURIComponent(JSON.stringify(content, null, 2)))), sha: file.sha })
        });
        if(save.ok) { st.style.color = "#2ecc71"; st.innerText = "SALVO!"; setTimeout(() => location.reload(), 1000); }
      } catch (e) { alert("Erro!"); btn.disabled = false; btn.innerText = "Tentar Novamente"; }
    }
  </script>
</body>
</html>
