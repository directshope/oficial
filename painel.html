<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Admin - DIRECT SHOP</title>
  <style>
    /* Design Premium do Painel */
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f0f0f;
      color: #fff;
      display: flex;
      justify-content: center;
      padding: 50px 20px;
    }
    .admin-container {
      background: #1a1a1a;
      width: 100%;
      max-width: 600px;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      border: 1px solid #333;
    }
    .admin-container h1 {
      text-align: center;
      color: #f1c40f;
      margin-bottom: 30px;
    }
    .input-group {
      margin-bottom: 20px;
    }
    .input-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: #ccc;
    }
    .input-group input {
      width: 100%;
      padding: 15px;
      background: #000;
      border: 1px solid #444;
      color: #fff;
      border-radius: 5px;
      box-sizing: border-box;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 15px;
      background: #f1c40f;
      color: #000;
      border: none;
      border-radius: 5px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      background: #d4ac0d;
    }

    /* Estilos do Popup (Modal) */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background: #1a1a1a;
      width: 90%;
      max-width: 800px;
      max-height: 80vh;
      overflow-y: auto;
      padding: 20px;
      border-radius: 10px;
      border: 1px solid #333;
      position: relative;
    }
    .close-btn {
      position: absolute;
      top: 15px; right: 20px;
      color: #fff;
      font-size: 24px;
      cursor: pointer;
      font-weight: bold;
    }
    .grid-resultados {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }
    .item-resultado {
      background: #000;
      border: 2px solid transparent;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
    }
    .item-resultado:hover {
      border-color: #f1c40f;
      transform: translateY(-3px);
    }
    .item-resultado img {
      width: 100%;
      height: 120px;
      object-fit: contain;
      background: #fff;
      border-radius: 5px;
    }
    .item-resultado h4 {
      font-size: 13px;
      margin: 10px 0 5px;
      color: #ddd;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .item-resultado p {
      color: #2ecc71;
      font-weight: bold;
      margin: 0;
    }

    /* Área de Preview do Card */
    #preview-area {
      display: none;
      margin-top: 30px;
      padding-top: 30px;
      border-top: 1px dashed #555;
    }
    .card-preview {
      background: #222;
      padding: 20px;
      border-radius: 8px;
      text-align: center;
      margin-bottom: 20px;
    }
    .card-preview img {
      max-width: 100%;
      height: 200px;
      object-fit: contain;
      border-radius: 5px;
      background: #fff;
    }
    .card-preview h3 {
      font-size: 16px;
      margin: 15px 0;
    }
    .card-preview p {
      color: #2ecc71;
      font-size: 22px;
      font-weight: bold;
      margin: 0;
    }
    .btn-salvar {
      background: #2ecc71;
      color: #fff;
    }
    .btn-salvar:hover {
      background: #27ae60;
    }
  </style>
</head>
<body>

  <div class="admin-container">
    <h1>DIRECT SHOP - Painel</h1>
    
    <div class="input-group">
      <label>1. Buscar produto no Mercado Livre:</label>
      <input type="text" id="termo-busca" placeholder="Ex: Fone Bluetooth, iPhone 13, etc...">
    </div>
    <button onclick="abrirPopupBusca()">Pesquisar Produto</button>

    <div id="preview-area">
      <div class="card-preview">
        <img id="prev-img" src="" alt="Imagem">
        <h3 id="prev-titulo">Título</h3>
        <p id="prev-preco">R$ 0,00</p>
      </div>

      <div class="input-group">
        <label>2. Cole o seu Link de Afiliado (Botão Comprar):</label>
        <input type="text" id="link-afiliado" placeholder="https://seu-link-de-afiliado.com...">
      </div>

      <button class="btn-salvar" onclick="salvarProduto()">Salvar Direto no Site</button>
    </div>
  </div>

  <div class="modal" id="modal-busca">
    <div class="modal-content">
      <span class="close-btn" onclick="fecharPopup()">&times;</span>
      <h2 style="margin-top:0;">Selecione o Produto</h2>
      <div id="loading-msg" style="display:none; text-align:center; color:#f1c40f;">Buscando no Mercado Livre...</div>
      <div class="grid-resultados" id="resultados-ml">
        </div>
    </div>
  </div>

  <script>
    let produtoSelecionado = {};

    // 1. Função Inteligente: Decide se busca por link direto ou abre o popup de pesquisa
    async function abrirPopupBusca() {
      const termo = document.getElementById('termo-busca').value.trim();
      
      if (!termo) {
        alert("Digite o nome de um produto ou cole um link!");
        return;
      }

      // Se for um link do Mercado Livre, extraímos o ID e buscamos direto
      if (termo.includes('mercadolivre.com')) {
        const match = termo.match(/MLB-?(\d+)/i);
        if (match) {
          const itemId = "MLB" + match[1];
          try {
            const res = await fetch(`https://api.mercadolibre.com/items/${itemId}`);
            if (!res.ok) throw new Error();
            const data = await res.json();
            
            // Pega a foto de alta qualidade
            const imagemAlta = data.pictures && data.pictures.length > 0 ? data.pictures[0].url : data.thumbnail.replace('-I.jpg', '-O.jpg');
            
            selecionarProduto(data.title, data.price, imagemAlta);
            return; // Encerra aqui, não precisa abrir popup
          } catch (e) {
            alert("Não encontrei esse produto pelo link. Tente digitar o nome dele.");
            return;
          }
        }
      }

      // Se não for link, abre o popup e faz a pesquisa normal
      document.getElementById('modal-busca').style.display = 'flex';
      document.getElementById('loading-msg').style.display = 'block';
      document.getElementById('resultados-ml').innerHTML = '';

      try {
        const response = await fetch(`https://api.mercadolibre.com/sites/MLB/search?q=${encodeURIComponent(termo)}&limit=12`);
        const data = await response.json();
        
        document.getElementById('loading-msg').style.display = 'none';

        if (data.results && data.results.length > 0) {
          renderizarResultados(data.results);
        } else {
          document.getElementById('resultados-ml').innerHTML = '<p>Nenhum produto encontrado com esse nome.</p>';
        }

      } catch (error) {
        document.getElementById('loading-msg').style.display = 'none';
        document.getElementById('resultados-ml').innerHTML = '<p style="color:red;">Erro ao conectar com o Mercado Livre.</p>';
      }
    }

    // 2. Monta a grade de opções dentro do popup
    function renderizarResultados(itens) {
      const container = document.getElementById('resultados-ml');
      container.innerHTML = ''; // Limpa antes de renderizar
      
      itens.forEach(item => {
        const imagemAlta = item.thumbnail.replace('-I.jpg', '-O.jpg');
        
        const div = document.createElement('div');
        div.className = 'item-resultado';
        div.innerHTML = `
          <img src="${imagemAlta}" alt="Foto">
          <h4>${item.title}</h4>
          <p>R$ ${item.price.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</p>
        `;
        
        div.onclick = () => selecionarProduto(item.title, item.price, imagemAlta);
        container.appendChild(div);
      });
    }

    // 3. Ao escolher o produto, preenche o preview e fecha o popup
    function selecionarProduto(titulo, preco, imagem) {
      produtoSelecionado = {
        nome: titulo,
        preco: typeof preco === 'number' ? preco.toFixed(2) : preco,
        imagem: imagem,
        loja: "ml"
      };

      document.getElementById('prev-img').src = produtoSelecionado.imagem;
      document.getElementById('prev-titulo').innerText = produtoSelecionado.nome;
      document.getElementById('prev-preco').innerText = "R$ " + parseFloat(produtoSelecionado.preco).toLocaleString('pt-BR', {minimumFractionDigits: 2});

      document.getElementById('preview-area').style.display = 'block';
      fecharPopup();
      
      // Foca no campo do link de afiliado para facilitar
      document.getElementById('link-afiliado').focus();
    }

    function fecharPopup() {
      document.getElementById('modal-busca').style.display = 'none';
    }

    // 4. Prepara para o Github (Apenas Alerta por enquanto, como solicitado)
    function salvarProduto() {
      const afiliado = document.getElementById('link-afiliado').value.trim();
      if (!afiliado) {
        alert("Cole o seu link de afiliado antes de salvar!");
        return;
      }
      produtoSelecionado.link = afiliado;
      console.log("Dados prontos:", produtoSelecionado);
      alert("Busca e seleção funcionando 100%! O próximo passo será salvar no GitHub.");
    }
  </script>
</body>
</html>
