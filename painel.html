<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - Direct Shop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .hidden { display: none; }
    </style>
</head>
<body class="bg-gray-900 text-white font-sans">

    <div id="login-screen" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-gray-800 p-8 rounded-lg shadow-xl w-full max-w-md">
            <h1 class="text-2xl font-bold mb-6 text-center text-blue-400">Acesso Restrito</h1>
            <p class="text-gray-400 mb-4 text-sm text-center">Insira sua Chave do GitHub para gerenciar os produtos.</p>
            <input type="password" id="github-token" placeholder="Cole sua Key aqui..." class="w-full p-3 rounded bg-gray-700 border border-gray-600 mb-4 focus:outline-none focus:border-blue-500">
            <button onclick="saveToken()" class="w-full bg-blue-600 hover:bg-blue-700 p-3 rounded font-bold transition">Entrar no Painel</button>
        </div>
    </div>

    <div id="admin-panel" class="hidden min-h-screen p-4 md:p-8">
        <div class="max-w-4xl mx-auto">
            <div class="flex justify-between items-center mb-8">
                <h1 class="text-3xl font-bold">Gerenciar Loja</h1>
                <button onclick="logout()" class="text-sm bg-red-600 px-3 py-1 rounded">Sair</button>
            </div>

            <div class="bg-gray-800 p-6 rounded-lg mb-8">
                <h2 class="text-xl mb-4 font-semibold">Adicionar Novo Produto</h2>
                <div class="flex flex-col md:flex-row gap-4">
                    <input type="text" id="ml-link" placeholder="Cole o link do Mercado Livre..." class="flex-1 p-3 rounded bg-gray-700 border border-gray-600">
                    <button onclick="fetchML()" class="bg-yellow-500 hover:bg-yellow-600 text-black font-bold px-6 py-3 rounded transition">Buscar Dados</button>
                </div>
            </div>

            <div id="preview-area" class="hidden bg-gray-800 p-6 rounded-lg border-2 border-blue-500">
                <div class="grid md:grid-cols-2 gap-6">
                    <img id="p-img" src="" class="w-full h-64 object-contain bg-white rounded">
                    <div>
                        <label class="block text-sm text-gray-400">Nome do Produto</label>
                        <input type="text" id="p-title" class="w-full p-2 mb-3 rounded bg-gray-700 border border-gray-600">
                        
                        <label class="block text-sm text-gray-400">Preço (R$)</label>
                        <input type="text" id="p-price" class="w-full p-2 mb-3 rounded bg-gray-700 border border-gray-600">

                        <label class="block text-sm text-gray-400">Seu Link de Afiliado</label>
                        <input type="text" id="p-link" placeholder="Cole seu link de afiliado aqui..." class="w-full p-2 mb-4 rounded bg-gray-700 border border-blue-900">

                        <button id="btn-save" onclick="saveToGithub()" class="w-full bg-green-600 hover:bg-green-700 p-4 rounded font-bold text-xl transition">SALVAR NA LOJA</button>
                        <p id="status-msg" class="mt-2 text-center font-bold"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const REPO = 'directshope/oficial'; // Seu repositório
        const FILE_PATH = 'produtos.json'; // Onde os produtos são salvos

        // Verifica se já tem o token salvo
        window.onload = () => {
            if(localStorage.getItem('gh_token')) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('admin-panel').classList.remove('hidden');
            }
        };

        function saveToken() {
            const token = document.getElementById('github-token').value;
            if(token) {
                localStorage.setItem('gh_token', token);
                location.reload();
            }
        }

        function logout() {
            localStorage.removeItem('gh_token');
            location.reload();
        }

        async function fetchML() {
            const link = document.getElementById('ml-link').value;
            const itemId = link.split('MLB-')[1]?.split('-')[0] || link.split('MLB')[1]?.split('/')[0];
            
            if(!itemId) return alert("Link inválido do Mercado Livre!");

            try {
                const response = await fetch(`https://api.mercadolibre.com/items/MLB${itemId}`);
                const data = await response.json();

                document.getElementById('p-title').value = data.title;
                document.getElementById('p-price').value = data.price.toLocaleString('pt-BR', {minimumFractionDigits: 2});
                document.getElementById('p-img').src = data.pictures[0].url;
                document.getElementById('preview-area').classList.remove('hidden');
            } catch (e) {
                alert("Erro ao buscar produto. Verifique o link.");
            }
        }

        async function saveToGithub() {
            const status = document.getElementById('status-msg');
            const token = localStorage.getItem('gh_token');
            status.innerText = "Salvando... aguarde.";
            
            const novoProduto = {
                titulo: document.getElementById('p-title').value,
                preco: document.getElementById('p-price').value,
                imagem: document.getElementById('p-img').src,
                link: document.getElementById('p-link').value
            };

            try {
                // 1. Pega o arquivo atual
                const getRes = await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE_PATH}`, {
                    headers: { 'Authorization': `token ${token}` }
                });
                const fileData = await getRes.json();
                const content = JSON.parse(atob(fileData.content));

                // 2. Adiciona o novo no topo da lista
                content.unshift(novoProduto);

                // 3. Envia de volta pro GitHub
                const putRes = await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE_PATH}`, {
                    method: 'PUT',
                    headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: "Novo produto adicionado",
                        content: btoa(unescape(encodeURIComponent(JSON.stringify(content, null, 2)))),
                        sha: fileData.sha
                    })
                });

                if(putRes.ok) {
                    status.className = "mt-2 text-center font-bold text-green-400";
                    status.innerText = "SUCESSO! Produto já está na vitrine.";
                    document.getElementById('ml-link').value = "";
                } else {
                    throw new Error();
                }
            } catch (e) {
                status.className = "mt-2 text-center font-bold text-red-400";
                status.innerText = "ERRO ao salvar. Verifique sua Key.";
            }
        }
    </script>
</body>
</html>
