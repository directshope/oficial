<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>DIRECT SHOP | ULTRA-WIDE DASHBOARD</title>
  <style>
    :root { 
      --gold: #f1c40f; 
      --gold-dark: #b8860b;
      --bg: #050505; 
      --card: #0d0d0d; 
      --border: #222; 
      --input: #000; 
    }
    
    body { 
      margin: 0; 
      font-family: 'Inter', 'Segoe UI', sans-serif; 
      background: var(--bg); 
      color: #fff; 
      display: flex; 
      justify-content: center; 
      min-height: 100vh;
    }

    /* Painel agora ocupa 95% da tela */
    .dashboard { 
      width: 95%; 
      max-width: 1700px; 
      background: var(--card); 
      margin: 20px 0;
      padding: 40px; 
      border-radius: 20px; 
      border: 1px solid var(--border); 
      box-shadow: 0 50px 100px rgba(0,0,0,1);
    }

    .header-dash { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      border-bottom: 3px solid var(--gold); 
      padding-bottom: 20px; 
      margin-bottom: 40px; 
    }
    
    .header-dash h2 { 
      margin: 0; 
      font-size: 32px; 
      letter-spacing: 5px; 
      font-weight: 900;
      color: var(--gold); 
    }

    /* Busca Gigante */
    .search-box { position: relative; margin-bottom: 40px; }
    #busca-editar { 
      width: 100%; 
      padding: 20px 25px; 
      background: var(--input); 
      border: 2px solid var(--gold); 
      color: #fff; 
      border-radius: 12px; 
      font-size: 18px; 
      font-weight: bold;
    }

    /* Grid Principal Espaçado */
    .main-grid { 
      display: grid; 
      grid-template-columns: 1fr 1fr; 
      gap: 50px; 
    }

    .column-title { 
      font-size: 14px; 
      color: var(--gold); 
      text-transform: uppercase; 
      margin-bottom: 25px; 
      letter-spacing: 2px; 
      font-weight: 800;
      display: flex; 
      align-items: center; 
      gap: 15px; 
    }
    .column-title::after { content: ""; flex: 1; height: 1px; background: #333; }

    .input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; margin-bottom: 20px; }
    .input-group { margin-bottom: 25px; }
    
    label { 
      display: block; 
      margin-bottom: 10px; 
      color: #aaa; 
      font-size: 12px; 
      font-weight: bold; 
      text-transform: uppercase; 
    }
    
    input, select { 
      width: 100%; 
      padding: 18px; 
      background: var(--input); 
      border: 1px solid #333; 
      color: #fff; 
      border-radius: 10px; 
      font-size: 16px; 
      transition: 0.3s; 
    }
    input:focus { border-color: var(--gold); background: #0a0a0a; outline: none; }

    /* Seção de Fotos em Grid */
    .photos-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

    /* Botões Imponentes */
    .actions { display: flex; gap: 20px; margin-top: 30px; }
    
    .btn-pub { 
      flex: 3; 
      padding: 25px; 
      background: var(--gold); 
      color: #000; 
      border: none; 
      border-radius: 12px; 
      font-size: 20px;
      font-weight: 900; 
      cursor: pointer; 
      text-transform: uppercase; 
      transition: 0.4s; 
    }
    .btn-new { 
      flex: 1; 
      padding: 25px; 
      background: #1a1a1a; 
      color: #fff; 
      border: 1px solid #333; 
      border-radius: 12px; 
      font-weight: bold; 
      cursor: pointer; 
      text-transform: uppercase; 
    }
    
    .btn-pub:hover { transform: scale(1.02); background: #fff; }
    .btn-new:hover { background: #333; }

    #lista-busca { 
      position: absolute; width: 100%; z-index: 100; 
      background: #000; border: 1px solid var(--gold); 
      max-height: 300px; overflow-y: auto; 
    }
    .item-busca { padding: 15px; border-bottom: 1px solid #222; cursor: pointer; color: var(--gold); font-weight: bold; }

    .logout-btn { background: none; color: #555; border: 1px solid #333; padding: 10px 20px; border-radius: 8px; cursor: pointer; transition: 0.3s; }
    .logout-btn:hover { color: var(--gold); border-color: var(--gold); }

    #status { margin-top: 20px; text-align: center; font-size: 18px; font-weight: 900; }
  </style>
</head>
<body>

  <div class="dashboard" id="admin-panel" style="display:block;">
    <div class="header-dash">
      <h2>DIRECT SHOP <span style="color:#fff; font-weight: 100;">MASTER ADMIN</span></h2>
      <button class="logout-btn" onclick="logout()">LOGOUT</button>
    </div>

    <div class="search-box">
      <input type="text" id="busca-editar" placeholder="🔍 PESQUISAR PRODUTO PARA EDITAR..." oninput="buscarParaEditar()">
      <div id="lista-busca"></div>
    </div>

    <div class="main-grid">
      <div class="col">
        <div class="column-title">Vendas & Categorização</div>
        
        <div class="input-group"><label>Nome do Produto (Título):</label><input type="text" id="p-titulo"></div>
        
        <div class="input-row">
          <div class="input-group"><label>Subtítulo (Ex: 200ml):</label><input type="text" id="p-subtitulo"></div>
          <div class="input-group"><label>Preço Final (R$):</label><input type="text" id="p-preco"></div>
        </div>

        <div class="input-row">
          <div class="input-group">
            <label>Categoria do Site:</label>
            <select id="p-categoria">
              <option value="perfumes">Perfumes</option>
              <option value="tecnologia">Tecnologia</option>
              <option value="beleza">Beleza e Cuidados Pessoais</option>
              <option value="ferramentas">Ferramentas</option>
              <option value="casa">Casa e Móveis</option>
              <option value="esportes">Esportes e Fitness</option>
              <option value="saude">Saúde</option>
              <option value="veiculos">Acessórios para Veículos</option>
              <option value="moda">Moda</option>
            </select>
          </div>
          <div class="input-group">
            <label>Selo de Destaque:</label>
            <select id="p-tag">
              <option value="">Sem Selo</option>
              <option value="Mais Vendido">🔥 Mais Vendido</option>
              <option value="Oferta do Dia">⚡ Oferta do Dia</option>
              <option value="Promoção">💎 Promoção</option>
            </select>
          </div>
        </div>

        <div class="column-title">Configurações de Link & Estoque</div>
        <div class="input-row">
          <div class="input-group"><label>ID Loja (ML/Shopee):</label><input type="text" id="p-loja" value="ml"></div>
          <div class="input-group"><label>Unidades em Estoque:</label><input type="number" id="p-estoque"></div>
        </div>
        <div class="input-group"><label>URL de Destino (Link Afiliado):</label><input type="text" id="p-link"></div>
      </div>

      <div class="col">
        <div class="column-title">Galeria de Imagens (HD)</div>
        <div class="photos-grid">
          <div class="input-group"><label>Imagem Principal (Capa):</label><input type="text" id="img1"></div>
          <div class="input-group"><label>Imagem 2:</label><input type="text" id="img2"></div>
          <div class="input-group"><label>Imagem 3:</label><input type="text" id="img3"></div>
          <div class="input-group"><label>Imagem 4:</label><input type="text" id="img4"></div>
        </div>

        <div class="column-title">Métricas de Avaliação</div>
        <div class="input-row">
          <div class="input-group"><label>Nota Geral (0 a 5):</label><input type="number" id="p-nota" step="0.1" value="4.8"></div>
          <div class="input-group"><label>Total de Avaliações:</label><input type="number" id="p-avaliacoes"></div>
        </div>

        <div class="actions">
          <button class="btn-new" onclick="limparFormulario()">LIMPAR TUDO</button>
          <button class="btn-pub" id="btn-save" onclick="salvarProduto()">PUBLICAR NO SITE AGORA</button>
        </div>
        <div id="status"></div>
      </div>
    </div>
  </div>

  <script>
    let produtosCarregados = [];
    let editandoIndex = null;

    // Lógica GitHub e Carregamento (Mantida igual para não quebrar)
    window.onload = () => { if(localStorage.getItem('gh_token')) mostrarPainel(); else document.getElementById('login-screen').style.display='block'; };
    
    function mostrarPainel() { 
        const admin = document.getElementById('admin-panel');
        if(admin) admin.style.display='block'; 
        carregarListaEdicao(); 
    }

    function limparFormulario() {
      editandoIndex = null;
      const ids = ['p-titulo', 'p-subtitulo', 'p-preco', 'p-link', 'p-avaliacoes', 'p-estoque', 'img1', 'img2', 'img3', 'img4'];
      ids.forEach(id => { const el = document.getElementById(id); if(el) el.value = ""; });
      document.getElementById('p-nota').value = "4.8";
      document.getElementById('p-loja').value = "ml";
      document.getElementById('p-tag').value = "";
      document.getElementById('p-categoria').value = "perfumes";
      document.getElementById('btn-save').innerText = "PUBLICAR NO SITE AGORA";
      document.getElementById('status').innerText = "";
    }

    async function carregarListaEdicao() {
      const u = localStorage.getItem('gh_user'), r = localStorage.getItem('gh_repo'), t = localStorage.getItem('gh_token');
      try {
        const res = await fetch(`https://api.github.com/repos/${u}/${r}/contents/produtos.json`, { headers: { 'Authorization': `token ${t}` } });
        const file = await res.json();
        produtosCarregados = JSON.parse(atob(file.content));
      } catch (e) { console.log("Aguardando JSON..."); }
    }

    function buscarParaEditar() {
      const termo = document.getElementById('busca-editar').value.toLowerCase();
      const lista = document.getElementById('lista-busca');
      lista.innerHTML = ""; if (termo.length < 2) return;
      produtosCarregados.forEach((p, index) => {
        if (p.titulo.toLowerCase().includes(termo)) {
          const item = document.createElement('div'); item.className = "item-busca"; item.innerText = "✏️ EDITAR: " + p.titulo;
          item.onclick = () => {
            editandoIndex = index;
            document.getElementById('p-titulo').value = p.titulo;
            document.getElementById('p-subtitulo').value = p.subtitulo || "";
            document.getElementById('p-preco').value = p.preco;
            document.getElementById('p-tag').value = p.tag || "";
            document.getElementById('p-nota').value = p.nota;
            document.getElementById('p-avaliacoes').value = p.avaliacoes;
            document.getElementById('p-estoque').value = p.estoque;
            document.getElementById('p-link').value = p.link;
            document.getElementById('p-loja').value = p.loja;
            document.getElementById('p-categoria').value = p.categoria || "perfumes";
            for(let i=1; i<=4; i++) { document.getElementById(`img${i}`).value = (p.imagens && p.imagens[i-1]) ? p.imagens[i-1] : ""; }
            document.getElementById('btn-save').innerText = "ATUALIZAR DADOS";
            document.getElementById('busca-editar').value = "";
            lista.innerHTML = "";
          };
          lista.appendChild(item);
        }
      });
    }

    async function salvarProduto() {
      const btn = document.getElementById('btn-save'), st = document.getElementById('status');
      const imgs = [1,2,3,4].map(i => document.getElementById(`img${i}`).value).filter(i => i !== "");
      const user = localStorage.getItem('gh_user'), repo = localStorage.getItem('gh_repo'), token = localStorage.getItem('gh_token');
      const url = `https://api.github.com/repos/${user}/${repo}/contents/produtos.json`;
      btn.disabled = true; btn.innerText = "SINCRONIZANDO...";
      try {
        const res = await fetch(url, { headers: { 'Authorization': `token ${token}` } });
        const file = await res.json();
        let content = JSON.parse(atob(file.content));
        const novoProduto = {
          titulo: document.getElementById('p-titulo').value,
          subtitulo: document.getElementById('p-subtitulo').value,
          preco: document.getElementById('p-preco').value,
          tag: document.getElementById('p-tag').value,
          nota: document.getElementById('p-nota').value,
          avaliacoes: document.getElementById('p-avaliacoes').value,
          estoque: document.getElementById('p-estoque').value,
          link: document.getElementById('p-link').value,
          loja: document.getElementById('p-loja').value,
          categoria: document.getElementById('p-categoria').value,
          imagens: imgs,
          data: editandoIndex !== null ? content[editandoIndex].data : new Date().toLocaleDateString('pt-BR')
        };
        if (editandoIndex !== null) content[editandoIndex] = novoProduto; else content.unshift(novoProduto);
        const save = await fetch(url, {
          method: 'PUT', headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: "Sincronização Painel Master", content: btoa(unescape(encodeURIComponent(JSON.stringify(content, null, 2)))), sha: file.sha })
        });
        if(save.ok) { st.style.color = "#2ecc71"; st.innerText = "🚀 DADOS ATUALIZADOS COM SUCESSO!"; setTimeout(() => limparFormulario(), 1500); carregarListaEdicao(); }
      } catch (e) { alert("Erro ao conectar!"); btn.disabled = false; btn.innerText = "TENTAR NOVAMENTE"; }
    }

    function logout() { localStorage.clear(); location.reload(); }
  </script>
</body>
</html>
