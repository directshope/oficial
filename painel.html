<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Admin Premium - DIRECT SHOP</title>
  <style>
    /* Design Premium do Painel */
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0a0a0a;
      color: #fff;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
    }
    .admin-container {
      background: #141414;
      width: 100%;
      max-width: 650px;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.9);
      border: 1px solid #222;
    }
    .admin-container h1 {
      text-align: center;
      color: #f1c40f;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 40px;
      font-size: 24px;
    }
    .input-group {
      margin-bottom: 25px;
    }
    .input-group label {
      display: block;
      margin-bottom: 10px;
      font-weight: bold;
      color: #888;
      font-size: 14px;
    }
    .input-group input {
      width: 100%;
      padding: 15px;
      background: #000;
      border: 1px solid #333;
      color: #fff;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 16px;
      transition: 0.3s;
    }
    .input-group input:focus {
      border-color: #f1c40f;
      outline: none;
      box-shadow: 0 0 10px rgba(241, 196, 15, 0.2);
    }
    .row {
      display: flex;
      gap: 20px;
    }
    .row .input-group {
      flex: 1;
    }
    button {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #f1c40f, #d4ac0d);
      color: #000;
      border: none;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.4s;
      text-transform: uppercase;
      margin-top: 10px;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(241, 196, 15, 0.3);
    }
    button:disabled {
      background: #444;
      color: #888;
      cursor: not-allowed;
    }
    .status-msg {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="admin-container">
    <h1>DIRECT SHOP - Injetor Premium</h1>
    
    <div class="input-group">
      <label>TÍTULO DO PRODUTO (Copie do Mercado Livre):</label>
      <input type="text" id="p-titulo" placeholder="Ex: Creatina Integralmédica 300g Monohidratada">
    </div>

    <div class="row">
      <div class="input-group">
        <label>PREÇO ATUAL (Apenas números):</label>
        <input type="text" id="p-preco" placeholder="Ex: 129,90">
      </div>
      <div class="input-group">
        <label>CATEGORIA / LOJA:</label>
        <input type="text" id="p-loja" value="Mercado Livre" placeholder="Ex: Mercado Livre">
      </div>
    </div>

    <div class="input-group">
      <label>LINK DA IMAGEM (Botão direito na foto > Copiar endereço da imagem):</label>
      <input type="text" id="p-img" placeholder="https://http2.mlstatic.com/...">
    </div>

    <div class="input-group">
      <label>SEU LINK DE AFILIADO (Botão Comprar):</label>
      <input type="text" id="p-link" placeholder="https://mercadolivre.com/seu-link-afiliado...">
    </div>

    <button id="btn-main" onclick="salvarProduto()">Salvar e Publicar no Site</button>
    <div id="status" class="status-msg"></div>
  </div>

  <script>
    const REPO = 'directshope/oficial';
    const FILE_PATH = 'produtos.json';

    // FUNÇÃO DE SEGURANÇA: Pega a Key do navegador, não do código
    function obterToken() {
      let token = localStorage.getItem('gh_token');
      if (!token) {
        token = prompt("🔒 ACESSO RESTRITO: Insira sua GitHub Key para gerenciar o site:");
        if (token) {
          localStorage.setItem('gh_token', token);
        }
      }
      return token;
    }

    async function salvarProduto() {
      const titulo = document.getElementById('p-titulo').value.trim();
      const preco = document.getElementById('p-preco').value.trim();
      const imagem = document.getElementById('p-img').value.trim();
      const link = document.getElementById('p-link').value.trim();
      const loja = document.getElementById('p-loja').value.trim();

      const GITHUB_TOKEN = obterToken(); // Busca a chave de forma segura

      if (!GITHUB_TOKEN) {
        alert("Erro: Você precisa da Key para salvar produtos.");
        return;
      }

      if (!titulo || !preco || !imagem || !link) {
        alert("Preencha todos os campos para manter o padrão premium.");
        return;
      }

      const btn = document.getElementById('btn-main');
      const status = document.getElementById('status');
      
      btn.innerText = "ENVIANDO DADOS...";
      btn.disabled = true;

      try {
        const getRes = await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE_PATH}`, {
          headers: { 'Authorization': `token ${GITHUB_TOKEN}` }
        });
        
        if (getRes.status === 401) {
          localStorage.removeItem('gh_token'); // Apaga a chave se estiver errada
          throw new Error("Key inválida ou expirada. Recarregue a página e tente de novo.");
        }

        const fileData = await getRes.json();
        const content = JSON.parse(atob(fileData.content));

        const novoProduto = {
          titulo: titulo,
          preco: preco.includes(',') ? preco : parseFloat(preco).toLocaleString('pt-BR', {minimumFractionDigits: 2}),
          imagem: imagem,
          link: link,
          loja: loja
        };

        content.unshift(novoProduto);

        const putRes = await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE_PATH}`, {
          method: 'PUT',
          headers: { 
            'Authorization': `token ${GITHUB_TOKEN}`,
            'Content-Type': 'application/json' 
          },
          body: JSON.stringify({
            message: `Injetado: ${titulo}`,
            content: btoa(unescape(encodeURIComponent(JSON.stringify(content, null, 2)))),
            sha: fileData.sha
          })
        });

        if (putRes.ok) {
          status.style.color = "#2ecc71";
          status.innerText = "PRODUTO PUBLICADO COM SUCESSO!";
          setTimeout(() => { location.reload(); }, 2000);
        } else {
          throw new Error("Erro ao salvar. Verifique se sua Key tem permissão 'repo'.");
        }

      } catch (error) {
        status.style.color = "#e74c3c";
        status.innerText = "ERRO: " + error.message;
        btn.innerText = "Tentar Novamente";
        btn.disabled = false;
      }
    }

    // Função para caso você queira trocar a Key depois (opcional)
    function trocarKey() {
      localStorage.removeItem('gh_token');
      location.reload();
    }
  </script>
</body>
</html>
