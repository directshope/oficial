<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Admin - DIRECT SHOP</title>
  <style>
    /* Design Premium do Painel */
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f0f0f;
      color: #fff;
      display: flex;
      justify-content: center;
      padding: 50px 20px;
    }
    .admin-container {
      background: #1a1a1a;
      width: 100%;
      max-width: 600px;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      border: 1px solid #333;
    }
    .admin-container h1 {
      text-align: center;
      color: #f1c40f;
      margin-bottom: 30px;
    }
    .input-group {
      margin-bottom: 20px;
    }
    .input-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: #ccc;
    }
    .input-group input {
      width: 100%;
      padding: 15px;
      background: #000;
      border: 1px solid #444;
      color: #fff;
      border-radius: 5px;
      box-sizing: border-box;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 15px;
      background: #f1c40f;
      color: #000;
      border: none;
      border-radius: 5px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      background: #d4ac0d;
    }

    /* Estilos do Popup (Modal) */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background: #1a1a1a;
      width: 90%;
      max-width: 800px;
      max-height: 80vh;
      overflow-y: auto;
      padding: 20px;
      border-radius: 10px;
      border: 1px solid #333;
      position: relative;
    }
    .close-btn {
      position: absolute;
      top: 15px; right: 20px;
      color: #fff;
      font-size: 24px;
      cursor: pointer;
      font-weight: bold;
    }
    .grid-resultados {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 15px;
      margin-top: 20px;
      padding: 10px;
    }
    .item-resultado {
      background: #000;
      border: 2px solid transparent;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
    }
    .item-resultado:hover {
      border-color: #f1c40f;
      transform: translateY(-3px);
    }
    .item-resultado img {
      width: 100%;
      height: 120px;
      object-fit: contain;
      background: #fff;
      border-radius: 5px;
    }
    .item-resultado h4 {
      font-size: 13px;
      margin: 10px 0 5px;
      color: #ddd;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .item-resultado p {
      color: #2ecc71;
      font-weight: bold;
      margin: 0;
    }

    /* Área de Preview do Card */
    #preview-area {
      display: none;
      margin-top: 30px;
      padding-top: 30px;
      border-top: 1px dashed #555;
    }
    .card-preview {
      background: #222;
      padding: 20px;
      border-radius: 8px;
      text-align: center;
      margin-bottom: 20px;
    }
    .card-preview img {
      max-width: 100%;
      height: 200px;
      object-fit: contain;
      border-radius: 5px;
      background: #fff;
    }
    .card-preview h3 {
      font-size: 16px;
      margin: 15px 0;
    }
    .card-preview p {
      color: #2ecc71;
      font-size: 22px;
      font-weight: bold;
      margin: 0;
    }
    .btn-salvar {
      background: #2ecc71;
      color: #fff;
    }
    .btn-salvar:hover {
      background: #27ae60;
    }
  </style>
</head>
<body>

  <div class="admin-container">
    <h1>DIRECT SHOP - Painel</h1>
    
    <div class="input-group">
      <label>1. Buscar produto no Mercado Livre:</label>
      <input type="text" id="termo-busca" placeholder="Ex: Fone Bluetooth, iPhone 13, etc...">
    </div>
    <button onclick="abrirPopupBusca()">Pesquisar Produto</button>

    <div id="preview-area">
      <div class="card-preview">
        <img id="prev-img" src="" alt="Imagem">
        <h3 id="prev-titulo">Título</h3>
        <p id="prev-preco">R$ 0,00</p>
      </div>

      <div class="input-group">
        <label>2. Cole o seu Link de Afiliado (Botão Comprar):</label>
        <input type="text" id="link-afiliado" placeholder="https://seu-link-de-afiliado.com...">
      </div>

      <button class="btn-salvar" onclick="salvarProduto()">Salvar Direto no Site</button>
    </div>
  </div>

  <div class="modal" id="modal-busca">
    <div class="modal-content">
      <span class="close-btn" onclick="fecharPopup()">&times;</span>
      <h2 style="margin-top:0;">Selecione o Produto</h2>
      <div id="loading-msg" style="display:none; text-align:center; color:#f1c40f;">Buscando no Mercado Livre...</div>
      <div class="grid-resultados" id="resultados-ml">
        </div>
    </div>
  </div>

  <script>
    let produtoSelecionado = {};

    async function abrirPopupBusca() {
      const termoInput = document.getElementById('termo-busca');
      const termo = termoInput.value.trim();
      
      if (!termo) {
        alert("Digite o nome de um produto!");
        return;
      }

      const modal = document.getElementById('modal-busca');
      const loading = document.getElementById('loading-msg');
      const container = document.getElementById('resultados-ml');

      modal.style.display = 'flex';
      loading.style.display = 'block';
      container.innerHTML = '';

      try {
        // Criamos a "Ponte" (Proxy) para o Mercado Livre não bloquear o seu site
        const apiML = `https://api.mercadolibre.com/sites/MLB/search?q=${encodeURIComponent(termo)}&limit=15`;
        const proxyURL = `https://corsproxy.io/?${encodeURIComponent(apiML)}`;

        const response = await fetch(proxyURL);
        
        if (!response.ok) {
          throw new Error("O servidor de busca está ocupado. Tente clicar em Pesquisar novamente.");
        }

        const data = await response.json();
        loading.style.display = 'none';

        if (data.results && data.results.length > 0) {
          data.results.forEach(item => {
            // Puxa a imagem em alta resolução automaticamente
            const imagemAlta = item.thumbnail.replace('-I.jpg', '-O.jpg');
            
            const div = document.createElement('div');
            div.className = 'item-resultado';
            div.innerHTML = `
              <img src="${imagemAlta}" alt="Foto">
              <h4>${item.title}</h4>
              <p>R$ ${item.price.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</p>
            `;
            
            div.onclick = () => selecionarProduto(item.title, item.price, imagemAlta);
            container.appendChild(div);
          });
        } else {
          container.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: #f1c40f;">Nenhum produto encontrado. Tente um nome mais curto.</p>`;
        }

      } catch (error) {
        loading.style.display = 'none';
        console.error("Erro técnico:", error);
        alert("Falha na conexão: O Mercado Livre bloqueou o acesso direto. Tente novamente agora.");
      }
    }

    function selecionarProduto(titulo, preco, imagem) {
      produtoSelecionado = {
        nome: titulo,
        preco: preco,
        imagem: imagem
      };

      // Preenche o seu Preview Premium
      document.getElementById('prev-img').src = imagem;
      document.getElementById('prev-titulo').innerText = titulo;
      document.getElementById('prev-preco').innerText = "R$ " + preco.toLocaleString('pt-BR', {minimumFractionDigits: 2});

      document.getElementById('preview-area').style.display = 'block';
      fecharPopup();
      
      // Foca direto no campo de link de afiliado para você só colar e salvar
      document.getElementById('link-afiliado').focus();
    }

    function fecharPopup() {
      document.getElementById('modal-busca').style.display = 'none';
    }

    function salvarProduto() {
      const afiliado = document.getElementById('link-afiliado').value.trim();
      if (!afiliado) {
        alert("Obrigatório: Insira seu link de afiliado para continuar.");
        return;
      }
      
      // Aqui entra o código de conexão com o GitHub que faremos a seguir
      console.log("Objeto pronto para o site:", { ...produtoSelecionado, link: afiliado });
      alert("Painel validado! O produto foi selecionado com sucesso. Agora vamos configurar o salvamento automático.");
    }
  </script>
</body>
</html>
