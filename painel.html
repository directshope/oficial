<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Direct Shop | Dashboard Premium</title>
    <style>
        :root {
            --gold: #f1c40f;
            --dark-bg: #050505;
            --card-bg: #111111;
            --input-bg: #000;
            --border: #222;
            --text: #ffffff;
            --text-muted: #888;
        }

        body { 
            margin: 0; 
            font-family: 'Inter', sans-serif; 
            background: var(--dark-bg); 
            color: var(--text); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 20px; 
        }

        .container { 
            background: var(--card-bg); 
            width: 100%; 
            max-width: 850px; 
            padding: 40px; 
            border-radius: 20px; 
            box-shadow: 0 30px 100px rgba(0,0,0,0.9); 
            border: 1px solid var(--border); 
        }

        h2 { color: var(--gold); text-transform: uppercase; text-align: center; margin-bottom: 30px; letter-spacing: 3px; font-weight: 900; }
        
        .section-title { 
            font-size: 11px; color: var(--gold); border-bottom: 1px solid var(--border); 
            padding-bottom: 8px; margin: 25px 0 15px; text-transform: uppercase; letter-spacing: 2px; font-weight: bold;
        }

        .input-group { margin-bottom: 15px; position: relative; }
        label { display: block; margin-bottom: 6px; color: var(--text-muted); font-size: 10px; text-transform: uppercase; font-weight: bold; }
        
        input, select, textarea { 
            width: 100%; padding: 12px; background: var(--input-bg); border: 1px solid var(--border); 
            color: var(--text); border-radius: 8px; box-sizing: border-box; font-size: 14px; transition: 0.3s; 
        }

        input:focus, select:focus, textarea:focus { border-color: var(--gold); outline: none; box-shadow: 0 0 10px rgba(241, 196, 15, 0.1); }

        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }

        button.btn-main { 
            width: 100%; padding: 18px; background: linear-gradient(135deg, #f1c40f, #d4ac0d); 
            color: #000; border: none; border-radius: 10px; font-size: 15px; font-weight: 800; 
            cursor: pointer; text-transform: uppercase; transition: 0.4s; margin-top: 20px;
        }

        button.btn-main:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(241, 196, 15, 0.3); }
        button.btn-main:disabled { background: #444; cursor: not-allowed; transform: none; }

        #lista-busca { 
            background: #000; border: 1px solid var(--gold); position: absolute; width: 100%; 
            z-index: 100; max-height: 200px; overflow-y: auto; display: none; border-radius: 0 0 8px 8px;
        }

        .item-busca { padding: 12px; border-bottom: 1px solid #111; cursor: pointer; font-size: 13px; color: var(--gold); }
        .item-busca:hover { background: #1a1a1a; }

        #status { margin-top: 20px; text-align: center; font-weight: bold; padding: 12px; border-radius: 8px; display: none; }
        
        .logout-btn { background: none; color: #555; border: none; font-size: 11px; cursor: pointer; text-decoration: underline; margin-top: 30px; display: block; width: 100%; text-align: center; }
        .logout-btn:hover { color: var(--gold); }

        #admin-panel { display: none; }
    </style>
</head>
<body>

<div class="container" id="login-screen">
    <h2>Acesso Admin</h2>
    <div class="input-group"><label>Usuário GitHub:</label><input type="text" id="gh-user" placeholder="ex: seu-usuario"></div>
    <div class="input-group"><label>Repositório:</label><input type="text" id="gh-repo" placeholder="ex: nome-do-projeto"></div>
    <div class="input-group"><label>GitHub Token (Key):</label><input type="password" id="gh-token" placeholder="ghp_xxxxxxxxxxxx"></div>
    <button class="btn-main" onclick="fazerLogin()">Entrar no Painel</button>
</div>

<div class="container" id="admin-panel">
    <h2>Direct Shop Dashboard</h2>

    <div class="section-title">🔍 Editar Produto Existente</div>
    <div class="input-group">
        <input type="text" id="busca-editar" placeholder="Digite o nome do produto para buscar..." oninput="buscarParaEditar()">
        <div id="lista-busca"></div>
    </div>

    <div class="section-title">📦 Dados do Produto</div>
    <div class="grid">
        <div class="input-group"><label>Título:</label><input type="text" id="p-titulo"></div>
        <div class="input-group"><label>Subtítulo (Ex: 200ml):</label><input type="text" id="p-subtitulo"></div>
    </div>

    <div class="grid">
        <div class="input-group"><label>Preço (R$):</label><input type="text" id="p-preco" placeholder="0,00"></div>
        <div class="input-group">
            <label>Categoria:</label>
            <select id="p-categoria">
                <option value="perfumes">Perfumes</option>
                <option value="tecnologia">Tecnologia</option>
                <option value="beleza">Beleza e Cuidados</option>
                <option value="ferramentas">Ferramentas</option>
                <option value="casa">Casa e Móveis</option>
                <option value="esportes">Esportes e Fitness</option>
                <option value="saude">Saúde</option>
                <option value="veiculos">Acessórios para Veículos</option>
                <option value="moda">Moda</option>
            </select>
        </div>
        <div class="input-group">
            <label>Selo:</label>
            <select id="p-tag">
                <option value="">Nenhum</option>
                <option value="Mais Vendido">🔥 Mais Vendido</option>
                <option value="Oferta do Dia">⚡ Oferta do Dia</option>
                <option value="Promoção">💎 Promoção</option>
                <option value="Frete Grátis">🚚 Frete Grátis</option>
            </select>
        </div>
    </div>

    <div class="grid">
        <div class="input-group"><label>Nota (0-5):</label><input type="number" id="p-nota" step="0.1" value="4.8"></div>
        <div class="input-group"><label>Avaliações:</label><input type="number" id="p-avaliacoes"></div>
        <div class="input-group"><label>Estoque:</label><input type="number" id="p-estoque"></div>
    </div>

    <div class="input-group">
        <label>Descrição Detalhada:</label>
        <textarea id="p-descricao" rows="3" placeholder="Detalhes técnicos, duração, marca..."></textarea>
    </div>

    <div class="section-title">🖼️ Galeria de Imagens (Links)</div>
    <div class="grid">
        <div class="input-group"><label>Foto 1 (Capa):</label><input type="text" id="img1"></div>
        <div class="input-group"><label>Foto 2:</label><input type="text" id="img2"></div>
    </div>
    <div class="grid">
        <div class="input-group"><label>Foto 3:</label><input type="text" id="img3"></div>
        <div class="input-group"><label>Foto 4:</label><input type="text" id="img4"></div>
    </div>

    <div class="section-title">🔗 Conexão e Destino</div>
    <div class="grid">
        <div class="input-group"><label>ID Loja (ex: ml ou shopee):</label><input type="text" id="p-loja" value="ml"></div>
        <div class="input-group"><label>Link de Compra:</label><input type="text" id="p-link"></div>
    </div>

    <button class="btn-main" id="btn-save" onclick="salvarProduto()">Publicar no Site</button>
    <div id="status"></div>
    <button class="logout-btn" onclick="logout()">Desconectar Conta</button>
</div>

<script>
    let produtosCarregados = [];
    let editandoIndex = null;

    window.onload = () => { if(localStorage.getItem('gh_token')) mostrarPainel(); };

    function mostrarPainel() {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('admin-panel').style.display = 'block';
        carregarDadosGithub();
    }

    function logout() { localStorage.clear(); location.reload(); }

    function fazerLogin() {
        const u = document.getElementById('gh-user').value.trim();
        const r = document.getElementById('gh-repo').value.trim();
        const t = document.getElementById('gh-token').value.trim();
        if(!u || !r || !t) return alert("Preencha todos os campos!");
        localStorage.setItem('gh_user', u);
        localStorage.setItem('gh_repo', r);
        localStorage.setItem('gh_token', t);
        mostrarPainel();
    }

    async function carregarDadosGithub() {
        const u = localStorage.getItem('gh_user'), r = localStorage.getItem('gh_repo'), t = localStorage.getItem('gh_token');
        try {
            const res = await fetch(`https://api.github.com/repos/${u}/${r}/contents/produtos.json`, {
                headers: { 'Authorization': `token ${t}` }
            });
            const data = await res.json();
            produtosCarregados = JSON.parse(decodeURIComponent(escape(atob(data.content))));
        } catch (e) { console.error("Erro ao carregar JSON"); }
    }

    function buscarParaEditar() {
        const termo = document.getElementById('busca-editar').value.toLowerCase();
        const lista = document.getElementById('lista-busca');
        lista.innerHTML = "";
        if (termo.length < 2) { lista.style.display = "none"; return; }

        const resultados = produtosCarregados.filter(p => p.titulo.toLowerCase().includes(termo));
        if(resultados.length > 0) {
            lista.style.display = "block";
            resultados.forEach(p => {
                const idx = produtosCarregados.indexOf(p);
                const item = document.createElement('div');
                item.className = "item-busca";
                item.innerText = "✏️ EDITAR: " + p.titulo;
                item.onclick = () => preencherFormulario(idx);
                lista.appendChild(item);
            });
        }
    }

    function preencherFormulario(idx) {
        const p = produtosCarregados[idx];
        editandoIndex = idx;
        document.getElementById('p-titulo').value = p.titulo;
        document.getElementById('p-subtitulo').value = p.subtitulo;
        document.getElementById('p-preco').value = p.preco;
        document.getElementById('p-categoria').value = p.categoria;
        document.getElementById('p-tag').value = p.tag || "";
        document.getElementById('p-nota').value = p.nota;
        document.getElementById('p-avaliacoes').value = p.avaliacoes;
        document.getElementById('p-estoque').value = p.estoque;
        document.getElementById('p-descricao').value = p.descricao || "";
        document.getElementById('p-loja').value = p.loja;
        document.getElementById('p-link').value = p.link;
        
        for(let i=1; i<=4; i++) {
            document.getElementById(`img${i}`).value = (p.imagens && p.imagens[i-1]) ? p.imagens[i-1] : "";
        }

        document.getElementById('btn-save').innerText = "ATUALIZAR PRODUTO";
        document.getElementById('lista-busca').style.display = "none";
        window.scrollTo({ top: 150, behavior: 'smooth' });
    }

    async function salvarProduto() {
        const btn = document.getElementById('btn-save');
        const st = document.getElementById('status');
        const user = localStorage.getItem('gh_user'), repo = localStorage.getItem('gh_repo'), token = localStorage.getItem('gh_token');
        
        const imgs = [1,2,3,4].map(i => document.getElementById(`img${i}`).value).filter(link => link !== "");
        
        const novoProduto = {
            titulo: document.getElementById('p-titulo').value,
            subtitulo: document.getElementById('p-subtitulo').value,
            preco: document.getElementById('p-preco').value,
            tag: document.getElementById('p-tag').value,
            nota: document.getElementById('p-nota').value,
            avaliacoes: document.getElementById('p-avaliacoes').value,
            estoque: document.getElementById('p-estoque').value,
            link: document.getElementById('p-link').value,
            loja: document.getElementById('p-loja').value,
            categoria: document.getElementById('p-categoria').value,
            descricao: document.getElementById('p-descricao').value,
            imagens: imgs,
            data: editandoIndex !== null ? produtosCarregados[editandoIndex].data : new Date().toLocaleDateString('pt-BR')
        };

        btn.disabled = true; btn.innerText = "SINCRONIZANDO...";

        try {
            const url = `https://api.github.com/repos/${user}/${repo}/contents/produtos.json`;
            const res = await fetch(url, { headers: { 'Authorization': `token ${token}` } });
            const file = await res.json();
            
            let content = JSON.parse(decodeURIComponent(escape(atob(file.content))));
            
            if (editandoIndex !== null) content[editandoIndex] = novoProduto;
            else content.unshift(novoProduto);

            const body = JSON.stringify({
                message: "Update produtos.json via Painel",
                content: btoa(unescape(encodeURIComponent(JSON.stringify(content, null, 2)))),
                sha: file.sha
            });

            const save = await fetch(url, {
                method: 'PUT',
                headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                body: body
            });

            if(save.ok) {
                st.style.display = "block"; st.style.background = "#2ecc7122"; st.style.color = "#2ecc71";
                st.innerText = "🚀 PUBLICADO COM SUCESSO NO GITHUB!";
                
                // Sincroniza a lista local com o que foi enviado para o GitHub
                produtosCarregados = content;
                editandoIndex = null;
                
                // Limpa o formulário para o próximo produto sem recarregar a página
                document.querySelectorAll('input:not([type=password]), textarea').forEach(input => input.value = "");
                document.getElementById('btn-save').innerText = "Publicar no GitHub";
                document.getElementById('btn-save').disabled = false;
                
                // Esconde a mensagem de sucesso após 3 segundos
                setTimeout(() => { st.style.display = "none"; }, 3000);
            } else { throw new Error(); }

        } catch (e) {
            alert("Erro ao salvar! Verifique sua Key e o nome do Repositório.");
            btn.disabled = false; btn.innerText = "Tentar Novamente";
        }
    }
</script>
</body>
</html>
