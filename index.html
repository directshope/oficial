<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DIRECT SHOP</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div class="logo">DIRECT SHOP</div>

  <input type="text" id="search" placeholder="Buscar produtos...">

  <select id="categoria">
    <option value="todos">Todas as Categorias</option>
    <option value="perfumes">Perfumes</option>
    <option value="tecnologia">Tecnologia</option>
    <option value="beleza">Beleza e Cuidados</option>
    <option value="ferramentas">Ferramentas</option>
    <option value="casa">Casa e Móveis</option>
    <option value="esportes">Esportes e Fitness</option>
    <option value="saude">Saúde</option>
    <option value="veiculos">Acessórios para Veículos</option>
    <option value="moda">Moda</option>
    </select>
</header>

<!-- BANNER SLIDER -->
<section class="banner">
  <div class="slides" id="slides">
    <img src="images/banner1.png">
    <img src="images/banner2.png">
    <img src="images/banner3.png">
  </div>
</section>

<!-- ABAS LOJAS -->
<section class="tabs">
  <button class="tab active" data-loja="all">Todos</button>
  <button class="tab" data-loja="ml">Mercado Livre</button>
  <button class="tab" data-loja="shopee">Shopee</button>
</section>

<!-- PRODUTOS -->
<section class="produtos" id="produtos"></section>
  <div id="modal-galeria" class="modal-foto">
  <div class="modal-content-premium">
    <span class="fechar-modal" onclick="fecharGaleria()">&times;</span>
    
    <img src="" id="foto-grande-modal" class="foto-principal-modal">
    
    <div class="miniaturas-row" id="miniaturas-container"></div>
    
    <h3 id="modal-titulo-produto" style="color: #f1c40f !important; font-weight: 800; text-transform: uppercase; margin: 20px 0 10px 0; font-size: 22px;"></h3>
    
    <div id="modal-descricao" style="color: #ffffff !important; font-size: 15px; line-height: 1.6; margin: 15px 0 25px 0; text-align: left; max-height: 200px; overflow-y: auto; padding-right: 10px; font-weight: 400; border-top: 1px solid #333; padding-top: 15px;"></div>
    
    <button id="modal-link-compra" style="background: #f1c40f; color: #000; font-weight: 900; width: 100%; padding: 18px; border: none; border-radius: 8px; cursor: pointer; text-transform: uppercase; font-size: 16px;">Comprar Agora</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
