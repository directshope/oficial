<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WaveShopBR | Oficial</title>

    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/png" href="images/logo.png" />
  </head>
  <body class="premium-dark">
    <div class="bg-glow"></div>

    <header class="header">
      <div class="logo">
        <span class="logo-wave">Wave</span><span class="logo-shop">Shop</span>
      </div>

      <div class="tabs-premium" id="abas-lojas"></div>

      <div class="header-tools">
        <input type="text" id="search" placeholder="Procurar produtos..." />
        <div class="custom-select-container">
          <div class="custom-select-trigger" id="categoria-trigger">
            Categorias
          </div>
          <div class="custom-select-options" id="categoria-options"></div>
        </div>
      </div>
    </header>

    <section class="banner">
      <div class="slides" id="slides"></div>
      <div class="banner-fade"></div>
    </section>

    <section class="marcas-container">
      <div class="marcas-track" id="marcas-track"></div>
    </section>

    <section class="nav-premium-container">
      <div class="nav-premium-card"></div>
    </section>

    <section class="produtos-section">
      <section class="produtos" id="produtos"></section>
    </section>

    <div id="modal-galeria" class="modal-foto">
      <div class="modal-content-premium">
        <span class="fechar-modal" onclick="fecharGaleria()">&times;</span>

        <div class="modal-esquerda">
          <div
            id="zoom-container"
            style="position: relative; display: flex; justify-content: center"
          >
            <img src="" id="foto-grande-modal" class="foto-principal-modal" />
            <div id="lens" class="zoom-lens"></div>
          </div>
          <div class="miniaturas-row" id="miniaturas-container"></div>
        </div>

        <div class="modal-direita">
          <h3 id="modal-titulo-produto"></h3>
          <div id="modal-descricao"></div>
          <button id="modal-link-compra" class="gold-button modal-cta">
            Comprar Agora
          </button>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
