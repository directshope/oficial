<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DIRECT SHOP | Oficial</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body class="premium-dark">

<div class="bg-glow"></div>

<header class="header">
  <div class="logo">DIRECT SHOP</div>
  <input type="text" id="search" placeholder="Procurar produtos exclusivos...">
  <select id="categoria">
    </select>
</header>

<section class="banner">
  <div class="slides" id="slides">
    </div>
  <div class="banner-fade"></div>
</section>

<section class="marcas-container">
  <div class="marcas-track" id="marcas-track">
    </div>
</section>

<section class="nav-premium-container">
  <div class="nav-premium-card">
    <span class="nav-label">EXPLORE LOJAS EXCLUSIVAS</span>
    <div class="tabs-premium" id="abas-lojas">
      <button class="tab-link active" data-loja="all">Todos os Produtos</button>
      <button class="tab-link" data-loja="ml">Mercado Livre</button>
      <button class="tab-link" data-loja="shopee">Shopee</button>
      <button class="tab-link" data-loja="tiktok">TikTok</button>
    </div>
  </div>
</section>

<section class="produtos-section">
  <section class="produtos" id="produtos"></section>
</section>

<div id="modal-galeria" class="modal-foto">
  <div class="modal-content-premium">
    <span class="fechar-modal" onclick="fecharGaleria()">&times;</span>
    
    <div class="modal-esquerda">
      <div id="zoom-container" style="position: relative; display: flex; justify-content: center;">
        <img src="" id="foto-grande-modal" class="foto-principal-modal">
        <div id="lens" class="zoom-lens"></div>
      </div>
      <div class="miniaturas-row" id="miniaturas-container"></div>
    </div>

    <div class="modal-direita">
      <h3 id="modal-titulo-produto"></h3>
      <div id="modal-descricao"></div>
      <button id="modal-link-compra" class="gold-button modal-cta">Comprar Agora</button>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
