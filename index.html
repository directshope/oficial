<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DIRECT SHOP | Premium Official</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body class="premium-dark">

<div class="bg-glow"></div>

<header class="header">
  <div class="logo">DIRECT SHOP</div>
  <input type="text" id="search" placeholder="Procurar produtos exclusivos...">
  <select id="categoria">
    <option value="todos">Todas as Categorias</option>
    <option value="perfumes">Perfumes</option>
    <option value="tecnologia">Tecnologia</option>
    <option value="beleza">Beleza e Cuidados</option>
    <option value="ferramentas">Ferramentas</option>
    <option value="casa">Casa e Móveis</option>
    <option value="esportes">Esportes e Fitness</option>
    <option value="saude">Saúde</option>
    <option value="veiculos">Acessórios auto</option>
    <option value="moda">Moda</option>
  </select>
</header>

<section class="banner">
  <div class="slides" id="slides">
    <img src="images/banner1.png" alt="Banner 1">
    <img src="images/banner2.png" alt="Banner 2">
    <img src="images/banner3.png" alt="Banner 3">
  </div>
  <div class="banner-fade"></div>
</section>

<section class="marcas-container">
  <div class="marcas-track">
    <span class="marca-item">APPLE</span>
    <span class="marca-item">XIAOMI</span>
    <span class="marca-item">SAMSUNG</span>
    <span class="marca-item">JBL</span>
    <span class="marca-item">BASEUS</span>
    <span class="marca-item">SONY</span>
    <span class="marca-item">LENOVO</span>
    <span class="marca-item">APPLE</span>
    <span class="marca-item">XIAOMI</span>
    <span class="marca-item">SAMSUNG</span>
    <span class="marca-item">JBL</span>
    <span class="marca-item">BASEUS</span>
    <span class="marca-item">SONY</span>
    <span class="marca-item">LENOVO</span>
  </div>
</section>

<section class="nav-premium-container">
  <div class="nav-premium-card">
    <div class="nav-label">EXPLORE AS LOJAS</div>
    <div class="tabs-premium" id="abas-lojas">
      <button class="tab-link active" data-loja="all">Todos</button>
      <button class="tab-link" data-loja="ml">Mercado Livre</button>
      <button class="tab-link" data-loja="shopee">Shopee</button>
      <button class="tab-link" data-loja="tiktok">TikTok</button>
    </div>
  </div>
</section>

<section class="produtos-section">
  <section class="produtos" id="produtos"></section>
</section>

<div id="modal-galeria" class="modal-foto">
  <div class="modal-content-premium">
    <span class="fechar-modal" onclick="fecharGaleria()">&times;</span>
    <img src="" id="foto-grande-modal" class="foto-principal-modal">
    <div class="miniaturas-row" id="miniaturas-container"></div>
    <h3 id="modal-titulo-produto"></h3>
    <div id="modal-descricao"></div>
    <button id="modal-link-compra" class="gold-button modal-cta">Comprar Agora</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
